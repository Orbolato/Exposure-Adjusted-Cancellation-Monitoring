name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned packages
        run: python -m pip install -r requirements-ci.txt
      - name: Compile all scripts
        run: python -m compileall -q scripts tests
      - name: Run integrity tests
        run: python -m pytest -q tests
      - name: Regenerate the article's tables from the archived results
        run: python scripts/make_tables.py --check
